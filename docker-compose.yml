

services:
  # ============================================
  # PostgreSQL Database (Zabbix + Auth data)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: pfe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - pfe-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_POSTGRES:-1g}

  # ============================================
  # Zabbix Server
  # ============================================
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: pfe-zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_ENABLE_SNMP_TRAPS: "true"
    depends_on:
      - postgres
    networks:
      - pfe-network
    ports:
      - "10051:10051"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_ZABBIX:-2g}

  # ============================================
  # Zabbix Web Interface
  # ============================================  # ============================================
  # Zabbix Web Interface
  # ============================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: pfe-zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: Africa/Tunis
      ZBX_SERVER_NAME: "louay-zabbix-server" 
    ports:
      - "${EXTERNAL_PORT_ZABBIX:-8080}:8080"
    depends_on:
      - postgres
      - zabbix-server
    networks:
      - pfe-network
    restart: unless-stopped


  # ============================================
  # Grafana (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: pfe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${EXTERNAL_PORT_GRAFANA:-3000}:3000"
    depends_on:
      - postgres
    networks:
      - pfe-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_GRAFANA:-512m}

  # ============================================
  # Milvus (Vector Database) - Uncomment in Week 5
  # ============================================
  # milvus:
  #   image: milvusdb/milvus:latest
  #   container_name: pfe-milvus
  #   ports:
  #     - "19530:19530"
  #   networks:
  #     - pfe-network
  #   restart: unless-stopped

  # ============================================
  # AI Chatbot - Uncomment in Week 6
  # ============================================
  ai-chatbot:
    build:
      context: ./ai-chatbot
      dockerfile: Dockerfile
    container_name: pfe-ai-chatbot
    environment:
      MODEL_PATH: ${AI_MODEL_PATH}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres
    volumes:
      - ./ai-chatbot/models:/app/models
    ports:
      - "${EXTERNAL_PORT_AI_API:-5000}:5000"
    networks:
      - pfe-network
    restart: unless-stopped


# ============================================
# Networks
# ============================================
networks:
  pfe-network:
    driver: bridge

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  postgres_data:
  grafana_data: