services:
  # --- DATABASE ---
  pfe_postgres:
    container_name: pfe_postgres
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_net

  # --- ZABBIX SERVER ---
  pfe_zabbix-server:
    container_name: pfe_zabbix-server
    image: zabbix/zabbix-server-pgsql:ubuntu-6.0-latest
    restart: always
    environment:
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ZBX_TLSPSKIDENTITY=${ZBX_TLSPSKIDENTITY}
      - ZBX_TLSPSKFILE=${ZBX_TLSPSKFILE}
    ports:
      - "10051:10051"
    volumes:
      - ./agent.psk:/var/lib/zabbix/enc/agent.psk:ro
      - ./server.psk:/var/lib/zabbix/enc/server.psk:ro
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres

  # --- ZABBIX WEB ---
  pfe_zabbix-web:
    container_name: pfe_zabbix-web
    image: zabbix/zabbix-web-apache-pgsql:ubuntu-6.0-latest
    restart: always
    environment:
      - ZBX_SERVER_HOST=pfe_zabbix-server
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PHP_TZ=Africa/Tunis
    ports:
      - "8080:8080"
    volumes:
      - ./agent.psk:/var/lib/zabbix/enc/agent.psk:ro
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres

 # --- AI ENGINE ---
  pfe_ai_engine:
    container_name: pfe_ai_engine
    build: .
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --workers 4
    environment:
      - DB_HOST=pfe_postgres
      - DB_NAME=${AI_DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - ./ai_engine:/app
      - ./templates:/app/templates
    working_dir: /app
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres  

  # --- GRAFANA ---
  pfe_grafana:
    container_name: pfe_grafana
    image: grafana/grafana-oss:latest
    user: "0"
    restart: always
    volumes:
      - ./grafana_data:/var/lib/grafana
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_CONTENT_SECURITY_POLICY=frame-ancestors 'self' http://localhost:5000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:3000:3000"

# --- GLOBAL NETWORKS DEFINITION ---
networks:
  nexus_net:
    driver: bridge