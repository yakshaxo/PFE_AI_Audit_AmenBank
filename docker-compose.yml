version: "3.9"

services:

  # -------------------------------------------------
  # PostgreSQL (Zabbix 6.0 LTS)
  # -------------------------------------------------
  postgres:
    image: postgres:13-alpine
    container_name: pfe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: zabbix
    volumes:
      - ./zabbix/postgres_data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    ports:
      - "5432:5432"

  # -------------------------------------------------
  # Zabbix Server 6.0 LTS (With Twilio DNS Bypass)
  # -------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0.29
    container_name: pfe_zabbix-server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: StrongPassword123
      TLSCONNECT: psk
      TLSACCEPT: psk
      TLSPSKIDENTITY: ServerID
      TLSPSKFILE: /etc/zabbix/ssl/server.psk
    volumes:
      - ./zabbix/ssl:/etc/zabbix/ssl
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    dns:
      - 8.8.8.8
    # DIRECT IP MAPPING: Bypasses "Could not resolve host" for Twilio
    extra_hosts:
      - "api.twilio.com:54.172.180.201"

  # -------------------------------------------------
  # Zabbix Web 6.0 LTS (With Twilio DNS Bypass)
  # -------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0.29
    container_name: pfe_zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: StrongPassword123
      PHP_TZ: Africa/Tunis
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
    dns:
      - 8.8.8.8
    extra_hosts:
      - "api.twilio.com:54.172.180.201"

  # -------------------------------------------------
  # Zabbix Agent 6.0 LTS
  # -------------------------------------------------
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-6.0.29
    container_name: pfe_zabbix-agent
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: agent_local
      TLSCONNECT: psk
      TLSACCEPT: psk
      TLSPSKIDENTITY: AgentID
      TLSPSKFILE: /etc/zabbix/ssl/agent.psk
    volumes:
      - ./zabbix_agent/agentd.conf:/etc/zabbix/zabbix_agent2.conf
      - ./zabbix/ssl:/etc/zabbix/ssl
    networks:
      - zabbix-net

  # -------------------------------------------------
  # Grafana (PRESERVING C:/grafana_data)
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:10.1.2
    container_name: pfe_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - zabbix-net

  # -------------------------------------------------
  # AI Engine
  # -------------------------------------------------
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: pfe_ai_engine
    restart: unless-stopped
    depends_on:
      - zabbix-web
    environment:
      ZABBIX_API_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_API_USER: Admin
      ZABBIX_API_PASS: zabbix
    ports:
      - "5000:5000"
    networks:
      - zabbix-net

# -------------------------------------------------
# Volumes: Host path mapped specifically
# -------------------------------------------------
volumes:
  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: C:/grafana_data
      o: bind

# -------------------------------------------------
# Network
# -------------------------------------------------
networks:
  zabbix-net:
    driver: bridge
