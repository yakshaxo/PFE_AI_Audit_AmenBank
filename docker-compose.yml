services:
  pfe_postgres:
    image: postgres:13-alpine
    container_name: pfe_postgres
    restart: unless-stopped
    env_file: .env 
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./zabbix/postgres_data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    ports:
      - "5432:5432"

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.0.29
    container_name: pfe_zabbix-server
    restart: unless-stopped
    depends_on:
      - pfe_postgres
    env_file: .env
    environment:
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./zabbix/ssl:/etc/zabbix/ssl
    ports:
      - "10051:10051"
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0.29
    container_name: pfe_zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
    env_file: .env
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - PHP_TZ=Africa/Tunis
    ports:
      - "8080:8080"
    networks:
      - zabbix-net

  pfe_grafana:
    image: grafana/grafana:10.1.2
    container_name: pfe_grafana
    restart: unless-stopped
    depends_on:
      - zabbix-web
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - C:/grafana_data:/var/lib/grafana
    networks:
      - zabbix-net

  pfe_ai_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfe_ai_engine
    restart: unless-stopped
    depends_on:
      - pfe_postgres
    env_file: .env 
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ai_engine:/app
      - ./templates:/app/templates
    ports:
      - "5000:5000"
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge