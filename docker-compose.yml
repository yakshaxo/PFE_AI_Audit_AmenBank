version: '3.8'

services:
  # --- DATABASE ---
  pfe_postgres:
    container_name: pfe_postgres
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_net

  # --- ZABBIX SERVER ---
  pfe_zabbix-server:
    container_name: pfe_zabbix-server
    image: zabbix/zabbix-server-pgsql:ubuntu-6.0-latest
    restart: always
    environment:
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "10051:10051"
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres

  # --- ZABBIX WEB ---
  pfe_zabbix-web:
    container_name: pfe_zabbix-web
    image: zabbix/zabbix-web-apache-pgsql:ubuntu-6.0-latest
    restart: always
    environment:
      - ZBX_SERVER_HOST=pfe_zabbix-server
      - DB_SERVER_HOST=pfe_postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PHP_TZ=Africa/Tunis
    ports:
      - "8080:8080"
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres

  # --- AI ENGINE ---
  pfe_ai_engine:
    container_name: pfe_ai_engine
    build: .
    restart: always
    environment:
      - DB_HOST=pfe_postgres
      - DB_NAME=${AI_DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - PYTHONUNBUFFERED=1
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - ./ai_engine:/app
      - ./templates:/app/templates
    working_dir: /app
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres

  # --- GRAFANA ---
  pfe_grafana:
    container_name: pfe_grafana
    image: grafana/grafana-oss:latest
    restart: always
    ports:
      - "3000:3000"
    networks:
      - nexus_net
    depends_on:
      - pfe_postgres
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer

networks:
  nexus_net:
    driver: bridge